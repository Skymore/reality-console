[package]
name = "release-manifest"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.2"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.18", features = ["serde", "v4"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.20"
