[package]
name = "control-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Shared versioned protocol and domain types for Reality Control, Node Host, and Connect"
license = "MIT"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
