[package]
name = "control-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Lightweight control-plane service for a private friend network"
license = "MIT"

[dependencies]
axum = "0.8"
base64 = "0.22"
control-protocol = { path = "../crates/control-protocol" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
fs2 = "0.4"
http-body-util = "0.1"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
url = "2"

[dev-dependencies]
futures-util = "0.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
