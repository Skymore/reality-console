[package]
name = "node-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Private Network node host foundation"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
control-protocol = { path = "../crates/control-protocol" }
crab_nat = "=0.6.0"
relay-server = { path = "../relay-server" }
xray-runtime = { path = "../crates/xray-runtime" }
ed25519-dalek = "2"
fs2 = "0.4"
igd-next = { version = "=0.16.0", features = ["aio_tokio"] }
netdev = "=0.35.3"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["macros"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2", features = ["serde"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
uuid = "=1.18.1"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.30", default-features = false, features = ["socket", "user"] }

[dev-dependencies]
assert_cmd = "2"
axum = "0.8"
control-server = { path = "../control-server" }
hex = "0.4"
predicates = "3"
rcgen = "0.14"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
