[package]
name = "release-manifest-tool"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.2"
release-manifest = { path = "../../crates/release-manifest" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
