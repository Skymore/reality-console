[package]
name = "reality-client"
version = "0.1.0"
description = "Cross-platform companion client for Reality Console"
authors = ["sky"]
edition = "2021"

[lib]
name = "reality_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
url = "2"
uuid = "1"
