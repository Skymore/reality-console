[package]
name = "reality-client"
version = "0.1.0"
description = "Cross-platform companion client for Private Network"
authors = ["sky"]
edition = "2021"

[lib]
name = "reality_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
base64 = "0.22"
control-protocol = { path = "../../crates/control-protocol" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures-util = "0.3"
percent-encoding = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tempfile = "3"
time = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
keyring = "4.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinInet"] }

[dev-dependencies]
axum = "0.8"
control-server = { path = "../../control-server" }
tokio = { version = "1", features = ["net"] }
