[package]
name = "reality-client"
version = "0.1.0"
description = "Cross-platform companion client for Reality Console"
authors = ["sky"]
edition = "2021"

[lib]
name = "reality_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
