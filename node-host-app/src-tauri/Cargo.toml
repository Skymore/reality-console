[package]
name = "private-network-node-host-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Native packaging shell for Private Network Node Host"
license = "MIT"

[lib]
name = "private_network_node_host_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
node-host = { path = "../../node-host" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.11.5", features = [] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
